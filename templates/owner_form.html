
{% extends "base.html" %}

{% block title %}Register Owner{% endblock %}

{% block content %}




<div class="container py-5" style="max-width: 760px;">

    <h2>Register New Owner</h2>
    <p class="text-muted">
        Enter the owner's personal information.
    </p>

    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>





    
    {% endif %}




    
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form method="POST"
                  action="{{ url_for('register_owner') }}">

                <input type="hidden"
                       name="_csrf_token"
                       value="{{ csrf_token }}">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">First Name *</label>
                        <input type="text"
                               name="first_name"
                               class="form-control"
                               maxlength="50"
                               value="{{ values.first_name }}"
                               required>
                    </div>





                    
                    <div class="col-md-6">
                        <label class="form-label">Last Name *</label>
                        <input type="text"
                               name="last_name"
                               class="form-control"
                               maxlength="50"
                               value="{{ values.last_name }}"
                               required>
                    </div>




                    

                    <div class="col-md-6">
                        <label class="form-label">CNIC Number *</label>
                        <input type="text"
                               name="cnic_number"
                               class="form-control"
                               placeholder="12345-1234567-1"
                               maxlength="15"
                               value="{{ values.cnic_number }}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel"
                               name="mobile_number"
                               class="form-control"
                               maxlength="15"
                               value="{{ values.mobile_number }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Email Address</label>
                        <input type="email"
                               name="email_address"
                               class="form-control"
                               maxlength="100"
                               value="{{ values.email_address }}">
                    </div>

                </div>







                
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Save Owner
                    </button>

                    <a href="{{ url_for('owners_page') }}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>





                
            </form>

        </div>
    </div>
</div>

{% endblock %}
