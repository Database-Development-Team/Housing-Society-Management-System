
{% extends "base.html" %}

{% block title %}Edit Owner{% endblock %}

{% block content %}

<div class="container py-5" style="max-width: 760px;">

    <h2>Edit Owner #{{ owner_id }}</h2>
    <p class="text-muted">Update owner contact details.</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form method="POST">

                <input type="hidden"
                       name="_csrf_token"
                       value="{{ csrf_token }}">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input class="form-control"
                               type="text"
                               name="first_name"
                               maxlength="50"
                               value="{{ values.first_name }}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input class="form-control"
                               type="text"
                               name="last_name"
                               maxlength="50"
                               value="{{ values.last_name }}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">CNIC (Read Only)</label>
                        <input class="form-control"
                               type="text"
                               value="{{ values.cnic_number }}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mobile Number</label>
                        <input class="form-control"
                               type="tel"
                               name="mobile_number"
                               maxlength="15"
                               value="{{ values.mobile_number }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Email Address</label>
                        <input class="form-control"
                               type="email"
                               name="email_address"
                               maxlength="100"
                               value="{{ values.email_address }}">
                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Update Owner
                    </button>

                    <a href="{{ url_for('owners_page') }}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
