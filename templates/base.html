
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        HSMS | {% block title %}Management System{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Shared Navigation -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">

            <span class="navbar-brand">
                Housing Society Management System
            </span>

            <div class="d-flex gap-2">

                <a href="{{ url_for('owners_page') }}"
                   class="btn btn-sm
                   {% if request.endpoint in [
                       'owners_page', 'register_owner',
                       'edit_owner', 'delete_owner'
                   ] %}
                       btn-light
                   {% else %}
                       btn-outline-light
                   {% endif %}">
                    Owners
                </a>

                <a href="{{ url_for('houses_page') }}"
                   class="btn btn-sm
                   {% if request.endpoint in [
                       'houses_page', 'register_house',
                       'edit_house', 'delete_house'
                   ] %}
                       btn-light
                   {% else %}
                       btn-outline-light
                   {% endif %}">
                    Houses
                </a>
                <a href="{{ url_for('residents_page') }}"
                        class="btn btn-sm btn-outline-light">
                      Residents
                 </a> 

                     <a href="{{ url_for('tenants_page') }}"
                        class="btn btn-sm btn-outline-light">
                     Tenants
                   </a>
                    
<a href="{{ url_for('leases_page') }}"
   class="btn btn-sm btn-outline-light">
    Leases
</a>


            </div>
        </div>
    </nav>

    <!-- Shared Success and Error Messages -->
    <div class="container pt-3">

        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% for category, message in messages %}
                <div class="alert alert-{{ category }}"
                     role="alert">
                    {{ message }}
                </div>
            {% endfor %}

        {% endwith %}

    </div>

    <!-- Content provided by each individual page -->
    {% block content %}
    {% endblock %}

</body>
</html>
